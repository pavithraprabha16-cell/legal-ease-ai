<DOCTYPE html>
<html>
<head>
    <title>LegalEase Document Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 40px; }
        .container { max-width: 650px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h1 { color: #2c3e50; text-align: center; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #34495e; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #2c3e50; }
        .draft-box { margin-top: 30px; padding: 20px; background-color: #ecf0f1; border-left: 5px solid #34495e; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚖️ LegalEase Generator</h1>
    <p>Generate professional legal drafts instantly.</p>
    
    <form action="/generate-doc" method="post">
        <label><b>Type of Document:</b></label>
        <input type="text" name="doc_type" placeholder="e.g., Non-Disclosure Agreement (NDA), Rental Lease" required>
        
        <label><b>Key Details to Include:</b></label>
        <textarea name="details" rows="4" placeholder="e.g., Between John Doe and Acme Corp, valid for 2 years..." required></textarea>
        
        <button type="submit">Draft Document</button>
    </form>

    {% if result %}
    <div class="draft-box">
        <h3>Generated Draft: {{ doc_type }}</h3>
        {{ result | safe }}
    </div>
    {% endif %}
</div>

</body>
</html>
